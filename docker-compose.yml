---
services:
  temper-py:
    container_name: temper-service
    image: temper/service:latest
    volumes:
      - /dev:/dev
    restart: no
    pull_policy: build
    build:
      context: .
      dockerfile: temper-service.Dockerfile
      args:
        - --no-cache
    healthcheck:
      test: curl --fail http://localhost:2610/metrics || exit 1
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s
    #ports:
    #  - 2610:2610
    privileged: true

  temper-exporter:
    container_name: temper-exporter
    image: temper/exporter:latest
    depends_on: ["temper-py"]
    restart: no
    pull_policy: build
    build:
      context: .
      dockerfile: temper-exporter.Dockerfile
      args:
        - --no-cache
    healthcheck:
      test: curl --fail http://localhost:8000/ || exit 1
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 20s
    #ports:
    #  - 8000:8000
